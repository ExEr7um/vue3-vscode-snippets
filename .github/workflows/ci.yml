name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  generate:
    name: Проверка генерации
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Настройка Bun
        uses: oven-sh/setup-bun@v2

      - name: Установка зависимостей
        run: bun install

      - name: Проверка манифеста расширения
        run: git diff --exit-code packages/vscode/package.json

  lint:
    uses: ExEr7um/workflows/.github/workflows/frontend-lint.yml@v0.10.0

  typecheck:
    uses: ExEr7um/workflows/.github/workflows/frontend-typecheck.yml@v0.10.0

  test:
    uses: ExEr7um/workflows/.github/workflows/frontend-test.yml@v0.10.0
